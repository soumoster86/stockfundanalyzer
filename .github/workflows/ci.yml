name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff

      - name: Ruff lint (src, ui, app, scripts, tests)
        run: |
          ruff check app.py src ui scripts tests --select E,F,I,W --ignore E501

      - name: Pytest
        run: |
          pytest -q --tb=short

      - name: Offline rescore smoke (demo data)
        run: |
          python scripts/rescore.py --in demo_data.csv --out-dir artifacts
          test -f artifacts/rankings_latest.csv
          test -f artifacts/score_summary.json
